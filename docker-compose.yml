version: '3.8'

services:
  sd-rx580:
    # Agora usando sua imagem publicada!
    image: ghcr.io/danarcanjosilva/sd-rx580-completo:latest
    container_name: sd-rx580
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    ports:
      - "7860:7860"
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - HIP_VISIBLE_DEVICES=0
      - PYTORCH_ROCM_ARCH=gfx803
      - COMMANDLINE_ARGS=--skip-torch-cuda-test --medvram --opt-sdp-attention --no-half-vae --precision full --no-half --listen
    volumes:
      - ./models:/app/stable-diffusion-webui/models
      - ./outputs:/app/stable-diffusion-webui/outputs
    restart: unless-stopped
